name: Build and Release inq_hpold
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '0.2.0-alpha3'
        type: string
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve version
        shell: pwsh
        run: |
          $version = '0.2.0-alpha3'
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $version = "${{ inputs.version }}".Trim()
          } elseif ("${{ github.ref_type }}" -eq 'tag') {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version empty' }
          "PROJECT_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python 2.7
        shell: pwsh
        run: |
          choco install python2 -y --no-progress
          $paths=@('C:\Python27\python.exe','C:\tools\python2\python.exe')
          $py=$paths | Where-Object {Test-Path $_} | Select-Object -First 1
          if (-not $py) {throw 'Python 2.7 not installed'}
          "PYTHON27=$py" >> $env:GITHUB_ENV
      - name: Verify bundled OldSkool resources
        shell: pwsh
        run: |
          $assets = @(
            'vendor/res/gui/flash/playersPanelAPI_modsCore.swf',
            'vendor/res/gui/hpbars/hp_bg.png',
            'vendor/res/gui/hpbars/hp_alive_l.png',
            'vendor/res/gui/hpbars/hp_alive_r.png',
            'vendor/res/gui/hpbars/hp_alive_cb.png'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing resource: $asset" }
          }
      - name: Package WOTMOD
        shell: pwsh
        run: |
          python build.py --python27 "$env:PYTHON27"
      - name: Verify WOTMOD
        shell: pwsh
        run: |
          @'
          import os, pathlib, zipfile
          path=pathlib.Path('build')/('inq_hpold_'+os.environ['PROJECT_VERSION']+'.wotmod')
          assert path.exists(), path
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert 'res/gui/flash/playersPanelAPI_modsCore.swf' in names
              assert 'res/gui/flash/inq_hpold.swf' not in names
              assert all('res/gui/hpbars/'+name in names for name in ('hp_bg.png','hp_alive_l.png','hp_alive_r.png','hp_alive_cb.png'))
              assert 'res/scripts/client/gui/mods/mod_inq_hpold.pyc' in names
              assert all(x.compress_type == zipfile.ZIP_STORED for x in z.infolist())
              assert all(not name.endswith('.py') for name in names)
              assert z.read('res/scripts/client/gui/mods/mod_inq_hpold.pyc')[:4] == bytes.fromhex('03f30d0a')
          print('Verified',path,path.stat().st_size)
          '@ | python -

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: inq_hpold-${{ env.PROJECT_VERSION }}
          path: build/inq_hpold_${{ env.PROJECT_VERSION }}.wotmod
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: inq_hpold v${{ env.PROJECT_VERSION }}
          artifacts: build/inq_hpold_${{ env.PROJECT_VERSION }}.wotmod
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
