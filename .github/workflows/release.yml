name: inq_hpold native AS3 test build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Python 2.7
        shell: pwsh
        run: |
          choco install python2 -y --no-progress
          $paths=@('C:\Python27\python.exe','C:\tools\python2\python.exe')
          $py=$paths | Where-Object {Test-Path $_} | Select-Object -First 1
          if (-not $py) {throw 'Python 2.7 not installed'}
          "PYTHON27=$py" >> $env:GITHUB_ENV
      - name: Obtain private SWC SDK inputs
        env:
          HPE_ACCESS_TOKEN: ${{ secrets.HPE_ACCESS_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HPE_ACCESS_TOKEN)) {
            throw 'Set HPE_ACCESS_TOKEN repository secret with read-only access to Dictor1488/HpE'
          }
          git -c http.extraheader="AUTHORIZATION: basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:HPE_ACCESS_TOKEN")))" clone --depth 1 https://github.com/Dictor1488/HpE.git "$env:RUNNER_TEMP\hpereference"
          New-Item -ItemType Directory -Force as3/libs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\hpereference\as3\libs\*.swc" as3/libs/
      - name: Download Flex SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.zip -OutFile "$env:RUNNER_TEMP\flex.zip"
          Expand-Archive "$env:RUNNER_TEMP\flex.zip" "$env:RUNNER_TEMP\flex"
          $root=Get-ChildItem "$env:RUNNER_TEMP\flex" -Recurse -Filter mxmlc.bat | Select-Object -First 1
          if (-not $root) {throw 'mxmlc not found'}
          "MXMLC=$($root.FullName)" >> $env:GITHUB_ENV
          $home=Split-Path (Split-Path $root.FullName)
          New-Item -ItemType Directory -Force "$home\frameworks\libs\player\32.0" | Out-Null
          Copy-Item as3/libs/playerglobal.swc "$home\frameworks\libs\player\32.0\playerglobal.swc"
      - name: Compile owned AS3 renderer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force as3/bin | Out-Null
          $a=@('-source-path+=as3/src_flash/src','-output=as3/bin/inq_hpold.swf','-target-player=32.0','-swf-version=39','-strict=true','-optimize=true')
          Get-ChildItem as3/libs -Filter *.swc | ForEach-Object {
            if ($_.Name -eq 'playerglobal.swc') {$a+="-library-path+=$($_.FullName)"}
            else {$a+="-external-library-path+=$($_.FullName)"}
          }
          $a+='--'
          $a+=(Resolve-Path as3/src_flash/src/InqHpoldPanel.as).Path
          & $env:MXMLC @a
          if ($LASTEXITCODE -ne 0) {throw 'ActionScript compilation failed'}
      - name: Package WOTMOD
        shell: pwsh
        run: |
          python build.py --python27 "$env:PYTHON27"
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: inq_hpold-native-0.2.0-alpha1
          path: build/*.wotmod
          if-no-files-found: error
          compression-level: 0
