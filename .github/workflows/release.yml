name: Build and Release inq_hpold
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '0.2.0'
        type: string
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve version
        shell: pwsh
        run: |
          $version = '0.2.0'
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $version = "${{ inputs.version }}".Trim()
          } elseif ("${{ github.ref_type }}" -eq 'tag') {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version empty' }
          "PROJECT_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Python 2.7
        shell: pwsh
        run: |
          choco install python2 -y --no-progress
          $paths=@('C:\Python27\python.exe','C:\tools\python2\python.exe')
          $py=$paths | Where-Object {Test-Path $_} | Select-Object -First 1
          if (-not $py) {throw 'Python 2.7 not installed'}
          "PYTHON27=$py" >> $env:GITHUB_ENV
      - name: Verify repository SWC libraries
        shell: pwsh
        run: |
          $libs = @(Get-ChildItem as3/libs -Filter *.swc)
          if ($libs.Count -ne 9) { throw "Expected 9 SWCs; found $($libs.Count)" }
          Write-Host "Available SWCs: $($libs.Count)"
      - name: Download Flex SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.zip -OutFile "$env:RUNNER_TEMP\flex.zip"
          Expand-Archive "$env:RUNNER_TEMP\flex.zip" "$env:RUNNER_TEMP\flex"
          $root=Get-ChildItem "$env:RUNNER_TEMP\flex" -Recurse -Filter mxmlc.bat | Select-Object -First 1
          if (-not $root) {throw 'mxmlc not found'}
          "MXMLC=$($root.FullName)" >> $env:GITHUB_ENV
          $flexHome=Split-Path (Split-Path $root.FullName)
          New-Item -ItemType Directory -Force "$flexHome\frameworks\libs\player\32.0" | Out-Null
          Copy-Item as3/libs/playerglobal.swc "$flexHome\frameworks\libs\player\32.0\playerglobal.swc"
          $configPath = Join-Path $flexHome 'frameworks/flex-config.xml'
          $configText = Get-Content $configPath -Raw
          $playerRoot = (Join-Path $flexHome 'frameworks/libs/player').Replace('\\','/')
          $configText = $configText.Replace('{playerglobalHome}', $playerRoot)
          [System.IO.File]::WriteAllText($configPath, $configText)
          if ((Get-Content $configPath -Raw).Contains('{playerglobalHome}')) { throw 'Unresolved playerglobalHome in flex-config.xml' }
      - name: Verify bundled OldSkool HP images
        shell: pwsh
        run: |
          foreach ($file in @('hp_bg.png','hp_alive_l.png','hp_alive_r.png','hp_alive_cb.png')) {
            if (-not (Test-Path "vendor/res/gui/hpbars/$file")) { throw "Missing HP image: $file" }
          }
      - name: Compile owned AS3 renderer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force as3/bin | Out-Null
          $a=@('-source-path+=as3/src_flash/src','-output=as3/bin/inq_hpold.swf','-target-player=32.0','-swf-version=39','-strict=true','-optimize=true')
          Get-ChildItem as3/libs -Filter *.swc | ForEach-Object {
            if ($_.Name -eq 'playerglobal.swc') {$a+="-library-path+=$($_.FullName)"}
            else {$a+="-external-library-path+=$($_.FullName)"}
          }
          $a+='--'
          $a+=(Resolve-Path as3/src_flash/src/InqHpoldPanel.as).Path
          & $env:MXMLC @a
          if ($LASTEXITCODE -ne 0) {throw 'ActionScript compilation failed'}
      - name: Package WOTMOD
        shell: pwsh
        run: |
          python build.py --python27 "$env:PYTHON27"
      - name: Verify WOTMOD
        shell: pwsh
        run: |
          @'
          import os, pathlib, zipfile
          path=pathlib.Path('build')/('inq_hpold_'+os.environ['PROJECT_VERSION']+'.wotmod')
          assert path.exists(), path
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert 'res/gui/flash/inq_hpold.swf' in names
              assert 'res/gui/flash/playersPanelAPI_modsCore.swf' not in names
              assert all('res/gui/hpbars/'+name in names for name in ('hp_bg.png','hp_alive_l.png','hp_alive_r.png','hp_alive_cb.png'))
              assert 'res/scripts/client/gui/mods/mod_inq_hpold.pyc' in names
              assert all(x.compress_type == zipfile.ZIP_STORED for x in z.infolist())
              assert all(not name.endswith('.py') for name in names)
              assert z.read('res/scripts/client/gui/mods/mod_inq_hpold.pyc')[:4] == bytes.fromhex('03f30d0a')
          print('Verified',path,path.stat().st_size)
          '@ | python -

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: inq_hpold-${{ env.PROJECT_VERSION }}
          path: build/inq_hpold_${{ env.PROJECT_VERSION }}.wotmod
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: inq_hpold v${{ env.PROJECT_VERSION }}
          artifacts: build/inq_hpold_${{ env.PROJECT_VERSION }}.wotmod
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: false
          makeLatest: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
