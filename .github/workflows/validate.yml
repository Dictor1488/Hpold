name: Validate inq_hpold native source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native build source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          expected=[
            'as3/src_flash/src/InqHpoldPanel.as',
            'as3/src_flash/src/inq/hpold/battle/HpPanel.as',
            'as3/src_flash/src/inq/hpold/battle/HealthRow.as',
            'python/gui/mods/mod_inq_hpold.py',
          ]
          assert all((root/p).is_file() for p in expected)
          assert len(list((root/'python').rglob('*.py'))) == 1
          print('Native source files present:',len(expected))
          PY
